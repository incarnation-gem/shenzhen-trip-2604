<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>🔒</title>
<style>
  :root{--txt:#1d1d1f;--sub:#86868b;--line:#e8e8ed;--purple:#af52de;--purple-bg:#f5ecfd}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f5f5f7;
    color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{width:100%;max-width:340px;background:#fff;border:1px solid var(--line);border-radius:20px;
    padding:34px 26px 28px;box-shadow:0 2px 12px rgba(0,0,0,.06);text-align:center}
  .lock{font-size:34px;margin-bottom:10px}
  h1{font-size:18px;font-weight:700;letter-spacing:.5px}
  .hint{font-size:12.5px;color:var(--sub);margin-top:6px;line-height:1.6}
  input{width:100%;font-size:17px;font-weight:600;letter-spacing:2px;text-align:center;
    border:1.5px solid var(--line);border-radius:12px;padding:13px;margin-top:20px;outline:none;
    -webkit-text-security:disc;font-family:inherit}
  input:focus{border-color:var(--purple)}
  button{width:100%;font-size:16px;font-weight:700;color:#fff;background:var(--purple);
    border:none;border-radius:12px;padding:14px;margin-top:14px;cursor:pointer;font-family:inherit}
  button:active{opacity:.75}
  .err{font-size:12.5px;color:#ff3b30;margin-top:12px;min-height:16px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid #d8d8dd;border-top-color:var(--purple);
    border-radius:50%;animation:r .7s linear infinite;vertical-align:-3px;margin-right:6px}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="lock">🔐</div>
  <h1>此内容已加密</h1>
  <div class="hint">输入访问密码解锁<br>解锁一次后本设备将保持解锁</div>
  <input id="pw" type="password" placeholder="访问密码" autocomplete="off">
  <button id="go">解锁</button>
  <div class="err" id="err"></div>
</div>
<script>
(function(){
  var VAULT_KEY = 'sztrip-pw-v1';
  var b64 = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };
  function unlock(pw, cb){
    fetch('vault.dat?v=' + '18').then(function(r){ return r.text(); }).then(function(t){
      var d = JSON.parse(t);
      return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
        .then(function(ki){
          return crypto.subtle.deriveKey(
            {name:'PBKDF2', salt: b64(d.salt), iterations: 120000, hash: 'SHA-256'},
            ki, {name:'AES-GCM', length: 256}, false, ['decrypt']);
        })
        .then(function(key){
          return crypto.subtle.decrypt({name:'AES-GCM', iv: b64(d.iv)}, key, b64(d.ct));
        })
        .then(function(buf){
          cb(new TextDecoder().decode(buf));
        });
    }).catch(function(){ cb(null); });
  }
  function render(html){
    document.open(); document.write(html); document.close();
  }
  var saved = null;
  try { saved = localStorage.getItem(VAULT_KEY); } catch(e) {}
  if (saved) {
    document.body.style.opacity = '.6';
    unlock(saved, function(html){ if (html) render(html); else { document.body.style.opacity = '1'; } });
  }
  document.getElementById('go').addEventListener('click', doUnlock);
  document.getElementById('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') doUnlock(); });
  function doUnlock(){
    var pw = document.getElementById('pw').value;
    if (!pw) return;
    var btn = document.getElementById('go');
    btn.innerHTML = '<span class="spin"></span>解锁中';
    btn.disabled = true;
    unlock(pw, function(html){
      if (html) {
        try { localStorage.setItem(VAULT_KEY, pw); } catch(e) {}
        render(html);
      } else {
        btn.innerHTML = '解锁'; btn.disabled = false;
        document.getElementById('err').innerText = '密码不正确，请重试';
      }
    });
  }
})();
</script>
</body>
</html>
